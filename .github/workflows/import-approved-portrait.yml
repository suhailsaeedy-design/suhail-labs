name: Import approved creator portrait
on:
  push:
    paths:
      - '.github/workflows/import-approved-portrait.yml'
permissions:
  contents: write
jobs:
  import-portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved portrait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname 'assets/images/suhail-saeedy-about-approved.jpeg')"
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/4b56334c-b17c-46f3-8b0c-0ade497c1921.jpeg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiNjEwYWY0Mjg5MGY5OWJlNyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDk3MTgxNn0.mEZpKqieTRDuvSrhtBZhxBq5PdSOnsYdwzHaEfgXMiM' -o 'assets/images/suhail-saeedy-about-approved.jpeg'
          file 'assets/images/suhail-saeedy-about-approved.jpeg'
      - name: Commit imported portrait
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'assets/images/suhail-saeedy-about-approved.jpeg'
          git diff --cached --quiet && exit 0
          git commit -m "Add approved creator portrait"
          git push
